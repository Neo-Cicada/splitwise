<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE">Splitwise</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Fraunces for display (its WONK axis gives the headings a printed,
      slightly irregular feel), Archivo for UI, IBM Plex Mono for every
      figure — money in a ledger must align digit to digit.
    -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!-- htmx: the server still renders every byte of HTML; htmx only swaps it in. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.7/htmx.min.js"
            integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<header class="masthead">
    <div class="masthead-inner">
        <a th:href="@{/}" class="wordmark"><span class="peso">₱</span>Splitwise</a>

        <nav>
            <ul>
                <li sec:authorize="isAuthenticated()"><a th:href="@{/groups}">Groups</a></li>

                <li sec:authorize="isAuthenticated()" class="who">
                    <small>Signed in as <strong sec:authentication="principal.displayName">Name</strong></small>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-ghost btn-small">Sign out</button>
                    </form>
                </li>

                <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Sign in</a></li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/register}">Register</a></li>
            </ul>
        </nav>
    </div>
</header>
<div class="rule-double"></div>

<main>
    <!-- Flash messages render above every page's content. -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section layout:fragment="content">
        <p>This placeholder is replaced by each page's content block.</p>
    </section>
</main>

<footer class="colophon">
    <span>Splitwise &middot; a shared ledger</span>
    <span>Balances derived, never stored</span>
</footer>

<!--
  CSRF stays on for htmx requests. Spring Security expects the token in a
  header for non-form posts; th:inline handles the escaping so the values
  never break out of the string.
-->
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var header = /*[[${_csrf != null ? _csrf.headerName : ''}]]*/ '';
        var token = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
        if (!header) return;
        document.body.addEventListener('htmx:configRequest', function (event) {
            event.detail.headers[header] = token;
        });
    })();
    /*]]>*/
</script>

</body>
</html>
