<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Groups</title>
</head>
<body>

<section layout:fragment="content">

    <div class="page-head reveal">
        <p class="eyebrow">Your books</p>
        <h1>Groups</h1>
        <p>Every group you currently keep a ledger with.</p>
    </div>

    <section class="panel reveal">
        <div class="panel-head">
            <h2 th:text="${#lists.size(groups)} + ' open'">0 open</h2>
            <a th:href="@{/groups/new}" role="button" class="btn-small">New group</a>
        </div>

        <div th:if="${#lists.isEmpty(groups)}" class="empty">
            <strong>No groups yet</strong>
            Start one to begin tracking shared expenses.
        </div>

        <ul th:unless="${#lists.isEmpty(groups)}" class="ledger">
            <li th:each="group : ${groups}">
                <a class="who-name" th:href="@{/groups/{id}(id=${group.id})}" th:text="${group.name}">Trip</a>
                <span class="stamp" th:text="${group.currency}">PHP</span>
                <span class="leader"></span>
                <span th:replace="~{fragments/datetime :: date(${group.createdAt})}">1 Jan 2026</span>
            </li>
        </ul>
    </section>

</section>

</body>
</html>
