<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Groups</title>
</head>
<body>

<section layout:fragment="content">

    <hgroup>
        <h1>Groups</h1>
        <p>Every group you are currently a member of.</p>
    </hgroup>

    <p><a th:href="@{/groups/new}" role="button">New group</a></p>

    <article th:if="${#lists.isEmpty(groups)}" class="empty-state">
        <p><strong>No groups yet.</strong></p>
        <p>Create one to start tracking shared expenses.</p>
    </article>

    <table th:unless="${#lists.isEmpty(groups)}">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Currency</th>
            <th scope="col">Created</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="group : ${groups}">
            <td><a th:href="@{/groups/{id}(id=${group.id})}" th:text="${group.name}">Trip</a></td>
            <td th:text="${group.currency}">PHP</td>
            <td><span th:replace="~{fragments/datetime :: date(${group.createdAt})}">1 Jan 2026</span></td>
        </tr>
        </tbody>
    </table>

</section>

</body>
</html>
