<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sign in</title>
</head>
<body>

<section layout:fragment="content" class="narrow">

    <div class="page-head reveal">
        <p class="eyebrow">Splitwise</p>
        <h1>Sign in</h1>
    </div>

    <div th:if="${loginError}" class="alert alert-error" role="alert">
        <span th:text="${loginError}">Bad credentials</span>
    </div>
    <div th:if="${loginNotice}" class="alert alert-success" role="status">
        <span th:text="${loginNotice}">Signed out</span>
    </div>

    <!-- Thymeleaf adds the CSRF hidden field to any th:action form. -->
    <form th:action="@{/login}" method="post" class="reveal">
        <label for="username">Email
            <input type="email" id="username" name="username"
                   autocomplete="username" required autofocus placeholder="you@example.com">
        </label>

        <label for="password">Password
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>
        </label>

        <div class="actions">
            <button type="submit">Sign in</button>
        </div>
    </form>

    <p style="margin-top:2rem"><small>No account yet? <a th:href="@{/register}">Create one</a>.</small></p>

</section>

</body>
</html>
