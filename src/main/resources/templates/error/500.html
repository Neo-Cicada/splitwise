<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Something went wrong</title>
</head>
<body>

<section layout:fragment="content" class="narrow">
    <div class="page-head reveal">
        <p class="eyebrow">500</p>
        <h1>Something went wrong</h1>
        <p>The error has been logged. Try again, or head back to your groups.</p>
    </div>
    <div class="actions">
        <a th:href="@{/groups}" role="button">Back to your groups</a>
    </div>
</section>

</body>
</html>
