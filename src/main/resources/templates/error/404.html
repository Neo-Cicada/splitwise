<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Not found</title>
</head>
<body>

<section layout:fragment="content" class="narrow">
    <div class="page-head reveal">
        <p class="eyebrow">404</p>
        <h1>Not found</h1>
        <p th:text="${message} ?: 'That page or record does not exist.'">That page or record does not exist.</p>
    </div>
    <div class="actions">
        <a th:href="@{/groups}" role="button">Back to your groups</a>
    </div>
</section>

</body>
</html>
